<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Electro Salah | إلكترونيات عصرية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="متجر إلكترونيات عصري – اطلب مباشرة عبر واتساب">

<style>
*{
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}
body{
  margin:0;
  background:#0b1220;
  color:#fff;
}

/* HEADER */
header{
  padding:25px;
  text-align:center;
  background:linear-gradient(90deg,#2563eb,#06b6d4);
}
header h1{
  margin:0;
  font-size:32px;
}
header p{
  margin-top:8px;
  opacity:.9;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:30px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:#111827;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:.3s;
}
.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}
.card-content h3{
  margin:0 0 6px;
}
.price{
  color:#38bdf8;
  font-weight:bold;
  margin-bottom:10px;
}

.order-btn{
  display:block;
  text-align:center;
  background:#22c55e;
  color:#fff;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}
.order-btn:hover{
  background:#16a34a;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  opacity:.6;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>Electro Salah</h1>
  <p>أفضل الإلكترونيات • طلب مباشر عبر واتساب</p>
</header>

<section class="products">

  <!-- PRODUCT 1 -->
  <div class="card">
    <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
    <div class="card-content">
      <h3>سماعات Bluetooth</h3>
      <div class="price">199 MAD</div>
      <a class="order-btn" href="https://wa.me/212614175097" target="_blank">
        اطلب الآن
      </a>
    </div>
  </div>

  <!-- PRODUCT 2 -->
  <div class="card">
    <img src="https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04">
    <div class="card-content">
      <h3>ساعة ذكية</h3>
      <div class="price">349 MAD</div>
      <a class="order-btn" href="https://wa.me/212614175097" target="_blank">
        اطلب الآن
      </a>
    </div>
  </div>

  <!-- PRODUCT 3 -->
  <div class="card">
    <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db">
    <div class="card-content">
      <h3>شاحن سريع</h3>
      <div class="price">99 MAD</div>
      <a class="order-btn" href="https://wa.me/212614175097" target="_blank">
        اطلب الآن
      </a>
    </div>
  </div>

</section>

<footer>
  © 2026 Electro Salah – جميع الحقوق محفوظة
</footer>

</body>
</html>
