<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Electro Salah | متجر إلكترونيات</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}
body{
  margin:0;
  background:#f4f6f8;
  color:#111;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation: fadeOut 1.5s ease forwards;
  animation-delay:3s;
}
#intro h1{
  text-align:center;
  font-size:36px;
  color:#2563eb;
  text-shadow:0 0 20px rgba(37,99,235,.6);
  animation: glow 1.5s infinite alternate;
}
@keyframes glow{
  from{opacity:.6}
  to{opacity:1}
}
@keyframes fadeOut{
  to{opacity:0; visibility:hidden;}
}

/* HEADER */
header{
  padding:25px;
  text-align:center;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}
header h2{margin:0}
header p{opacity:.9}

/* SEARCH */
.search-box{
  max-width:500px;
  margin:25px auto;
  text-align:center;
}
.search-box input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
  padding:30px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
  transition:.3s;
}
.card:hover{transform:translateY(-8px)}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:18px;
}
.card-content h3{margin:0 0 8px}
.card-content p{
  font-size:14px;
  color:#555;
}
.price{
  margin:12px 0;
  font-weight:bold;
  color:#2563eb;
}

.order-btn{
  display:block;
  text-align:center;
  padding:12px;
  border-radius:12px;
  background:#22c55e;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}
.order-btn:hover{background:#16a34a}

footer{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>
    السلام عليكم 👋<br>
    مرحبًا بكم في متجر إلكترونيات صلاح
  </h1>
</div>

<header>
  <h2>Electro Salah</h2>
  <p>إلكترونيات مختارة بعناية • طلب مباشر عبر واتساب</p>
</header>

<div class="search-box">
  <input type="text" placeholder="ابحث عن المنتج الذي تريد..." onkeyup="searchProduct(this.value)">
</div>

<section class="products" id="products">
  <!-- المنتجات ستظهر هنا تلقائيًا -->
</section>

<footer>
© 2026 Electro Salah
</footer>

<script>
let allProducts = [];

fetch('products.json')
  .then(response => response.json())
  .then(products => {
    allProducts = products;
    showProducts(products);
  });

function showProducts(products){
  const container = document.getElementById('products');
  container.innerHTML = '';
  products.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.image}">
        <div class="card-content">
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <div class="price">${p.price}</div>
          <a class="order-btn"
             href="https://wa.me/212614175097?text=أريد%20${encodeURIComponent(p.name)}"
             target="_blank">
             اطلب الآن
          </a>
        </div>
      </div>
    `;
  });
}

function searchProduct(value){
  value = value.toLowerCase();
  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(value)
  );
  showProducts(filtered);
}
</script>

</body>
</html>
