<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Electro Salah | متجر إلكترونيات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #000;
    }

    /* شاشة الترحيب */
    #intro {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOut 1.2s ease forwards;
      animation-delay: 2.8s;
    }

    #intro h1 {
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* الهيدر */
    header {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #fff;
      padding: 50px 20px;
      text-align: center;
    }

    header h2 {
      margin: 0;
      font-size: 2.4rem;
    }

    header p {
      margin-top: 10px;
      opacity: 0.85;
    }

    /* البحث */
    .search-box {
      max-width: 420px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 30px;
      border: 1px solid #ddd;
      font-size: 1rem;
      outline: none;
    }

    /* المتجر (فارغ) */
    .products {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      font-size: 1.1rem;
      padding: 60px 0;
    }
  </style>
</head>

<body>

  <!-- شاشة الترحيب -->
  <div id="intro">
    <h1>مرحبًا بكم في<br>Electro Salah</h1>
  </div>

  <!-- الموقع -->
  <header>
    <h2>Electro Salah</h2>
    <p>إلكترونيات مختارة بعناية · طلب مباشر عبر واتساب</p>
  </header>

  <div class="search-box">
    <input type="text" placeholder="ابحث عن المنتج الذي تريد..." disabled>
  </div>

  <section class="products">
    <div class="empty">
      لا توجد منتجات بعد.<br>
      سيتم عرض المنتجات هنا فور إضافتها من لوحة الإدارة.
    </div>
  </section>

</body>
</html>

</body>
</html>
