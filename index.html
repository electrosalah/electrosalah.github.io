<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Electro Salah | متجر الإلكترونيات</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #ffffff;
      text-align: center;
    }

    /* شاشة الترحيب */
    #welcome {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #welcome h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    #welcome h2 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: normal;
    }

    #welcome h3 {
      font-size: 34px;
      font-weight: bold;
      margin: 0;
    }

    /* الموقع */
    #site {
      display: none;
      padding: 30px;
    }

    input {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- شاشة الترحيب -->
  <div id="welcome">
    <h1>السلام عليكم ورحمة الله وبركاته</h1>
    <h2>مرحبا بكم في</h2>
    <h3>Electro Salah</h3>
  </div>

  <!-- الموقع -->
  <div id="site">
    <h2>🔍 إبحث عن منتجك</h2>
    <input type="text" placeholder="اكتب اسم المنتج..." />
    <p style="margin-top:20px;">المنتجات ستظهر هنا إن شاء الله</p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("site").style.display = "block";
    }, 3000);
  </script>

</body>
</html>
