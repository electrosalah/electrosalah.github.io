<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Electro Salah | متجر إلكترونيات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000;
    }

    /* شاشة الترحيب */
    #intro {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOut 1.5s ease forwards;
      animation-delay: 3.5s;
    }

    .intro-box {
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    .intro-box h1 {
      margin: 0;
      font-size: 44px;
      font-weight: 800;
    }

    .intro-box h2 {
      margin: 12px 0 0;
      font-size: 30px;
      font-weight: 600;
    }

    .intro-box h3 {
      margin: 14px 0 0;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    header {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #fff;
      padding: 30px 15px;
      text-align: center;
    }

    header h2 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    .search-box {
      margin: 30px auto;
      max-width: 400px;
      text-align: center;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    #products {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #666;
      font-size: 18px;
      padding: 60px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- شاشة البداية -->
  <div id="intro">
    <div class="intro-box">
      <h1>السلام عليكم</h1>
      <h2>السلام عليكم ورحمة الله وبركاته</h2>
      <h3>Bienvenue chez Electro Salah</h3>
    </div>
  </div>

  <header>
    <h2>Electro Salah</h2>
    <p>إلكترونيات مختارة بعناية · طلب مباشر عبر واتساب</p>
  </header>

  <div class="search-box">
    <input type="text" placeholder="ابحث عن المنتج الذي تريد...">
  </div>

  <div id="products">
    <div class="empty">
      لا توجد منتجات حاليًا.<br>
      سيتم عرض المنتجات فور إضافتها من لوحة الإدارة.
    </div>
  </div>

  <footer>
    Electro Salah © 2026
  </footer>

</body>
</html>
