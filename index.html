<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Electro Salah | متجر الإلكترونيات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000;
    }

    /* شاشة الترحيب */
    #splash {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 2s ease forwards;
      animation-delay: 3.5s;
    }

    #splash h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    #splash h2 {
      font-size: 26px;
      margin: 5px 0;
    }

    #splash h3 {
      font-size: 34px;
      margin: 10px 0;
      font-weight: bold;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* المتجر */
    #shop {
      display: none;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .search {
      margin: 20px 0;
      text-align: center;
    }

    .search input {
      width: 80%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h4 {
      margin: 10px 0 5px;
    }

    .product p {
      font-size: 14px;
      color: #555;
    }

    .buy {
      margin-top: 10px;
      padding: 10px;
      background: black;
      color: white;
      text-decoration: none;
      display: inline-block;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <!-- شاشة الترحيب -->
  <div id="splash">
    <h1>السلام عليكم ورحمة الله وبركاته</h1>
    <h2>مرحبا بكم في</h2>
    <h3>Electro Salah</h3>
  </div>

  <!-- المتجر -->
  <div id="shop">
    <div class="search">
      <input type="text" placeholder="ابحث عن منتجك..." />
    </div>

    <div class="products">
      <div class="product">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" />
        <h4>iPhone 15 Pro</h4>
        <p>أداء قوي، كاميرا احترافية، وتصميم فاخر.</p>
        <a class="buy" href="https://wa.me/212600000000" target="_blank">اطلب الآن</a>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1518444028785-8f7c1b7c1c0d" />
        <h4>ساعة ذكية</h4>
        <p>تتبع صحي، بطارية قوية، تصميم أنيق.</p>
        <a class="buy" href="https://wa.me/212600000000" target="_blank">اطلب الآن</a>
      </div>
    </div>
  </div>

  <script>
    // بعد انتهاء الترحيب، أظهر المتجر
    setTimeout(() => {
      document.getElementById("shop").style.display = "block";
    }, 3500);
  </script>

</body>
</html>
