<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Electro Salah | متجر إلكترونيات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #ffffff;
      color: #000;
    }

    /* شاشة الترحيب */
    #intro {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: hideIntro 1.4s ease forwards;
      animation-delay: 2.8s;
    }

    .intro-text {
      text-align: center;
      animation: fadeIn 1.2s ease;
    }

    .salam {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .welcome {
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .brand {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* المتجر */
    main {
      padding: 40px;
      text-align: center;
      display: none;
    }

    /* أنيميشن */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes hideIntro {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>

<body>

  <!-- شاشة الترحيب -->
  <div id="intro">
    <div class="intro-text">
      <div class="salam">السلام عليكم ورحمة الله وبركاته</div>
      <div class="welcome">مرحبا بكم في</div>
      <div class="brand">Electro Salah</div>
    </div>
  </div>

  <!-- المتجر (فارغ إلى أن تضيف المنتجات من admin) -->
  <main id="shop">
    <!-- هنا ستظهر المنتجات لاحقاً -->
  </main>

  <script>
    setTimeout(() => {
      document.getElementById("shop").style.display = "block";
    }, 2800);
  </script>

</body>
</html>
