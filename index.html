<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Electro Salah | متجر إلكترونيات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000;
    }

    #intro {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOut 1.5s ease forwards;
      animation-delay: 2.5s;
    }

    #intro h1 {
      font-size: 42px;
      font-weight: 700;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    header {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #fff;
      padding: 30px 15px;
      text-align: center;
    }

    .search-box {
      margin: 30px auto;
      max-width: 400px;
      text-align: center;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    #products {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }

    .product img {
      max-width: 100%;
      border-radius: 12px;
    }

    .product h3 {
      margin: 10px 0 5px;
    }

    .product p {
      font-weight: bold;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #666;
      font-size: 18px;
      padding: 60px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="intro">
    <h1>مرحبًا بكم في متجر Electro Salah</h1>
  </div>

  <header>
    <h2>Electro Salah</h2>
    <p>إلكترونيات مختارة · طلب مباشر عبر واتساب</p>
  </header>

  <div class="search-box">
    <input type="text" id="search" placeholder="ابحث عن المنتج...">
  </div>

  <div id="products">
    <div class="empty">جاري تحميل المنتجات...</div>
  </div>

  <footer>
    Electro Salah © 2026
  </footer>

  <script>
    let allProducts = [];

    fetch("products.json")
      .then(res => res.json())
      .then(data => {
        allProducts = data.reverse(); // الجديد قبل القديم
        renderProducts(allProducts);
      });

    function renderProducts(products) {
      const container = document.getElementById("products");
      container.innerHTML = "";

      if (products.length === 0) {
        container.innerHTML = `<div class="empty">لا توجد منتجات</div>`;
        return;
      }

      products.forEach(p => {
        container.innerHTML += `
          <div class="product">
            <img src="${p.image}" alt="">
            <h3>${p.name}</h3>
            <p>${p.price} DH</p>
          </div>
        `;
      });
    }

    document.getElementById("search").addEventListener("input", e => {
      const value = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p =>
        p.name.toLowerCase().includes(value)
      );
      renderProducts(filtered);
    });
  </script>

</body>
</html>
