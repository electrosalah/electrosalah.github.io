<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin – Electro Salah</title>

<style>
*{
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body{
  margin:0;
  height:100vh;
  background: linear-gradient(135deg,#eef3ff,#f9fbff);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* كرت الدخول */
.card{
  background:white;
  width:360px;
  border-radius:22px;
  padding:30px;
  box-shadow:0 25px 60px rgba(0,0,0,.12);
  animation:fadeUp 1s ease;
}

/* العنوان */
h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
}

/* مربعات كلمة المرور */
.pin{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:25px;
}

.pin input{
  width:55px;
  height:65px;
  font-size:26px;
  text-align:center;
  border-radius:14px;
  border:1px solid #dbe3ff;
  background:#f5f8ff;
  outline:none;
  transition:.3s;
}

.pin input:focus{
  border-color:#4f6bff;
  background:#fff;
}

/* زر */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  background:linear-gradient(135deg,#4f6bff,#6a7dff);
  color:white;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

/* لوحة التحكم */
#panel{
  display:none;
}

textarea,input[type=text]{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-bottom:12px;
}

input[type=file]{
  margin-bottom:15px;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="card" id="login">
  <h2>دخول الأدمن</h2>

  <div class="pin">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
  </div>

  <button onclick="check()">دخول</button>
</div>

<div class="card" id="panel">
  <h2>بسم الله وزد منتجك إن شاء الله</h2>

  <input type="text" placeholder="اسم المنتج">
  <textarea placeholder="وصف المنتج"></textarea>
  <input type="file">
  <button>حفظ المنتج</button>
</div>

<script>
const inputs=document.querySelectorAll('.pin input');
inputs.forEach((i,idx)=>{
  i.addEventListener('input',()=>{
    if(i.value && inputs[idx+1]) inputs[idx+1].focus();
  });
});

function check(){
  let code='';
  inputs.forEach(i=>code+=i.value);
  if(code==='0000'){
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
  }else{
    alert('كلمة المرور غير صحيحة');
  }
}
</script>

</body>
</html>
