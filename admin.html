<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
:root{
  --primary:#4f46e5;
  --dark:#0f172a;
  --bg:#f6f8fc;
}

*{box-sizing:border-box;font-family:'Segoe UI',Tahoma}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
}

.hidden{display:none}

/* animations */
.fade{
  animation:fade .6s ease;
}
.slide{
  animation:slide .6s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}
@keyframes slide{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* login */
#login{
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 30px 70px rgba(0,0,0,.15);
  text-align:center;
}

#code{
  border:none;
  border-bottom:2px solid #ddd;
  font-size:32px;
  letter-spacing:12px;
  text-align:center;
  width:160px;
  outline:none;
}

button{
  margin-top:20px;
  padding:14px 28px;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  cursor:pointer;
}

/* dashboard */
#dashboard{
  width:90%;
  max-width:1100px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.menu{
  cursor:pointer;
  font-weight:600;
  color:var(--primary);
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  min-height:240px;
  box-shadow:0 20px 50px rgba(0,0,0,.12);
  transition:.4s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-8px)
}

.plus{
  font-size:72px;
  color:var(--primary);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
}

/* products page */
#productsPage{
  background:white;
  padding:40px;
  border-radius:24px;
  box-shadow:0 30px 70px rgba(0,0,0,.15);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="fade">
  <h2>دخول الإدارة</h2>
  <input id="code" maxlength="4" placeholder="0000">
  <br>
  <button onclick="login()">دخول</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden slide">
  <div class="top">
    <h2>مرحبا بك</h2>
    <div class="menu" onclick="openProducts()">المنتجات المعروضة</div>
  </div>

  <div class="cards">
    <div class="card">
      <h3>آخر منتج</h3>
      <p id="lastProduct">لا يوجد منتجات</p>
    </div>

    <div class="card">
      <h3>إضافة منتج</h3>
      <input id="pname" placeholder="اسم المنتج">
      <textarea id="pdesc" placeholder="وصف المنتج"></textarea>
      <button onclick="addProduct()">حفظ</button>
    </div>

    <div class="card" onclick="addProduct()">
      <div class="plus">+</div>
    </div>
  </div>
</div>

<!-- PRODUCTS PAGE -->
<div id="productsPage" class="hidden slide">
  <h2>المنتجات</h2>
  <p id="productsList">لم يتم إضافة أي منتج إلى الآن</p>
  <br>
  <button onclick="back()">رجوع</button>
</div>

<script>
let products=[];

function login(){
  const code=document.getElementById('code').value;
  if(code==='0000'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
  }
}

function addProduct(){
  const name=document.getElementById('pname').value;
  if(!name)return;

  products.push(name);
  document.getElementById('lastProduct').innerText=name;
  document.getElementById('pname').value='';
}

function openProducts(){
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('productsPage').classList.remove('hidden');

  document.getElementById('productsList').innerText=
    products.length ? products.join(' • ') : 'لم يتم إضافة أي منتج إلى الآن';
}

function back(){
  document.getElementById('productsPage').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
}
</script>

</body>
</html>
