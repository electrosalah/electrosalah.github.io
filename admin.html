<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin – Electro Salah</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:"Segoe UI",Tahoma,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hidden{display:none}
.box{
  background:#fff;
  width:460px;
  max-width:95%;
  padding:25px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
  animation:fade .8s ease;
}
h1{text-align:center;margin-bottom:20px}
label{display:block;margin-top:15px;font-weight:600}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}
button{
  margin-top:20px;
  width:100%;
  padding:14px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
button:hover{background:#1d4ed8}
textarea{
  width:100%;
  margin-top:20px;
  height:180px;
  border-radius:10px;
  padding:12px;
  font-family:monospace;
  font-size:14px;
}
.product-count{
  text-align:center;
  margin-top:10px;
  font-weight:600;
  color:#2563eb;
}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h1>دخول الأدمين</h1>
  <input id="pass" placeholder="أدخل كلمة المرور">
  <button onclick="login()">دخول</button>
</div>

<!-- DASHBOARD -->
<div class="box hidden" id="adminBox">
  <h1>إضافة منتج</h1>

  <label>اسم المنتج</label>
  <input id="name">

  <label>السعر</label>
  <input id="price">

  <label>ارفع صورة المنتج</label>
  <input id="image" type="file" accept="image/*">

  <button onclick="addProduct()">إضافة المنتج</button>

  <div class="product-count" id="count">عدد المنتجات: 0</div>

  <button onclick="generateJSON()">إنشاء products.json</button>

  <textarea id="result" placeholder="انسخ هذا المحتوى وضعه في ملف products.json"></textarea>
</div>

<script>
const products = [];

function login(){
  if(document.getElementById("pass").value === "0000"){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminBox").classList.remove("hidden");
  } else {
    alert("كلمة المرور غير صحيحة");
  }
}

function addProduct(){
  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const imageInput = document.getElementById("image");

  if(!name || !price || !imageInput.files[0]){
    alert("أكمل جميع الحقول");
    return;
  }

  const imagePath = "images/" + imageInput.files[0].name;

  products.push({
    name:name,
    price:price,
    image:imagePath
  });

  document.getElementById("count").innerText =
    "عدد المنتجات: " + products.length;

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  imageInput.value="";
}

function generateJSON(){
  document.getElementById("result").value =
    JSON.stringify(products, null, 2);
}
</script>

</body>
</html>
