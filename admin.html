<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة الإدارة - Electro Salah</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  font-family: 'Cairo', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.admin-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  padding: 30px;
  width: 420px;
  border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

.admin-card h2 {
  text-align: center;
  margin-bottom: 10px;
}

.icons {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  outline: none;
}

input[type="file"] {
  background: #fff;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  border: none;
  border-radius: 10px;
  font-size: 16px;
  color: #fff;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="admin-card">
  <h2>🔒 لوحة إدارة المنتجات</h2>
  <div class="icons">💻 🎮 🔌</div>

  <input type="text" id="name" placeholder="اسم المنتج">
  <textarea id="desc" placeholder="وصف المنتج"></textarea>

  <label>📷 صورة المنتج</label>
  <input type="file" id="image" accept="image/*">

  <button onclick="save()">💾 حفظ المنتج</button>
</div>

<script>
function save() {
  const name = document.getElementById("name").value;
  const desc = document.getElementById("desc").value;
  const imageInput = document.getElementById("image");

  if (name) localStorage.setItem("productName", name);
  if (desc) localStorage.setItem("productDesc", desc);

  if (imageInput.files[0]) {
    const reader = new FileReader();
    reader.onload = function () {
      localStorage.setItem("productImage", reader.result);
      alert("✅ تم حفظ المنتج بنجاح");
    };
    reader.readAsDataURL(imageInput.files[0]);
  } else {
    alert("⚠️ اختر صورة للمنتج");
  }
}
</script>

</body>
</html>

</script>

</body>
</html>
