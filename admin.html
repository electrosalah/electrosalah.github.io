<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Electro Salah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#eaf6ff;
      --bg2:#f4f0ff;
      --primary:#2563eb;
      --glass:rgba(255,255,255,0.6);
    }
    *{box-sizing:border-box;font-family:'Cairo',sans-serif}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .illustration{
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 20% 20%, #c7d2fe 0, transparent 40%),
        radial-gradient(circle at 80% 30%, #bae6fd 0, transparent 45%),
        radial-gradient(circle at 50% 80%, #ddd6fe 0, transparent 40%);
      z-index:-1;
    }
    .card{
      width:360px;
      background:var(--glass);
      backdrop-filter:blur(18px);
      border-radius:24px;
      padding:32px;
      box-shadow:0 20px 50px rgba(0,0,0,.12);
      text-align:center;
    }
    h1{margin:0 0 12px;font-size:28px;color:#111}
    p{color:#555;margin-bottom:24px}
    input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #ddd;
      margin-bottom:16px;
      font-size:16px;
    }
    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg,#2563eb,#4f46e5);
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:.3s;
    }
    button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(37,99,235,.4)}
  </style>
</head>
<body>
  <div class="illustration"></div>
  <div class="card">
    <h1>Electro Salah</h1>
    <p>الدخول إلى لوحة الإدارة</p>
    <input type="password" placeholder="كلمة المرور" />
    <button>دخول</button>
  </div>
</body>
</html>

</body>
</html>
