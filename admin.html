<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة الإدارة | Electro Salah</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}

.container{
  display:flex;
  height:100vh;
}

.sidebar{
  width:260px;
  background:rgba(0,0,0,0.4);
  padding:30px;
}

.sidebar h2{
  text-align:center;
  margin-bottom:40px;
}

.sidebar ul{
  list-style:none;
  padding:0;
}

.sidebar li{
  margin:20px 0;
  font-size:18px;
}

.content{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  color:#333;
  width:520px;
  padding:30px;
  border-radius:18px;
  box-shadow:0 25px 50px rgba(0,0,0,.3);
}

.card h3{
  text-align:center;
  margin-bottom:25px;
  color:#0072ff;
}

input,textarea{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:15px;
}

input[type="file"]{
  border:none;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{opacity:.9}

.preview{
  margin-top:15px;
  text-align:center;
}

.preview img{
  max-width:100%;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h2>⚡ Electro Salah</h2>
    <ul>
      <li>📱 إلكترونيات</li>
      <li>💻 حواسيب</li>
      <li>🎮 ألعاب</li>
      <li>⚙️ إعدادات</li>
    </ul>
  </div>

  <div class="content">
    <div class="card">
      <h3>إضافة / تعديل منتج</h3>

      <input id="name" placeholder="اسم المنتج">
      <textarea id="desc" rows="4" placeholder="وصف المنتج"></textarea>

      <input type="file" id="image" accept="image/*" onchange="previewImage()">

      <div class="preview">
        <img id="preview">
      </div>

      <button onclick="save()">💾 حفظ المنتج</button>
    </div>
  </div>

</div>

<script>
function previewImage(){
  const file=document.getElementById("image").files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=e=>document.getElementById("preview").src=e.target.result;
    reader.readAsDataURL(file);
  }
}

function save(){
  localStorage.setItem("productName",name.value);
  localStorage.setItem("productDesc",desc.value);

  if(image.files[0]){
    const reader=new FileReader();
    reader.onload=()=>localStorage.setItem("productImage",reader.result);
    reader.readAsDataURL(image.files[0]);
  }

  alert("✅ تم حفظ المنتج بنجاح");
}
</script>

</body>
</html>
