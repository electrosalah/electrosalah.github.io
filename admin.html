<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Admin Premium</title>
<style>
:root{
  --light:#f6f8fc;
  --dark:#0f172a;
  --primary:#4f46e5;
}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;align-items:center;justify-content:center;
}
.hidden{display:none}
/* Login */
#login{
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 40px 80px rgba(0,0,0,.15);
  text-align:center;
  animation:fadeUp 1s ease;
}
#code{
  width:160px;
  text-align:center;
  font-size:32px;
  letter-spacing:12px;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
}
button{
  margin-top:20px;
  padding:14px 28px;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  font-size:16px;
  cursor:pointer;
}
/* Dashboard */
#dashboard{
  width:90%;max-width:1100px;
  animation:fadeIn 1s ease;
}
.top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:30px
}
.menu{cursor:pointer;color:var(--dark);font-weight:600}
.cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:30px
}
.card{
  background:white;border-radius:24px;
  padding:24px;min-height:260px;
  box-shadow:0 30px 60px rgba(0,0,0,.12);
  position:relative;transition:.4s
}
.card:hover{transform:translateY(-8px)}
.number{
  position:absolute;top:-14px;right:-14px;
  background:var(--primary);color:white;
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold
}
.preview img{width:100%;border-radius:16px}
form input,form textarea{
  width:100%;margin-bottom:12px;padding:12px;border-radius:12px;border:1px solid #ddd
}
.plus{
  font-size:72px;color:var(--primary);
  display:flex;align-items:center;justify-content:center;height:100%
}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div id="login">
  <h2>دخول الأدمين</h2>
  <input id="code" maxlength="4" placeholder="0000" />
  <br />
  <button onclick="login()">دخول</button>
</div>

<div id="dashboard" class="hidden">
  <div class="top">
    <h2>السلام عليكم يا صاحب المتجر</h2>
    <div class="menu">قائمة المنتجات</div>
  </div>

  <div class="cards">
    <div class="card" id="card1">
      <div class="number">1</div>
      <div class="preview">آخر منتج سيظهر هنا</div>
    </div>

    <div class="card" id="card2">
      <div class="number">2</div>
      <form onsubmit="saveProduct(event)">
        <input placeholder="اسم المنتج" required />
        <textarea placeholder="وصف المنتج"></textarea>
        <input type="file" accept="image/*" />
        <button>حفظ المنتج</button>
      </form>
    </div>

    <div class="card">
      <div class="number">3</div>
      <div class="plus">+</div>
    </div>
  </div>
</div>

<script>
function login(){
  if(document.getElementById('code').value==='0000'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
  }
}
function saveProduct(e){
  e.preventDefault();
  document.querySelector('#card1 .preview').innerText='تم إضافة منتج جديد';
}
</script>
</body>
</html>
