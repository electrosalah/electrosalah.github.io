<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Admin - Electro Salah</title>
  <style>
    * {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #dbeafe, #eef2ff, #f0f9ff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== Login Card ===== */
    .login-card, .admin-card {
      background: white;
      padding: 30px;
      width: 360px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      animation: fadeUp 0.8s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    textarea {
      resize: none;
      height: 90px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- 🔐 Login -->
  <div class="login-card" id="loginBox">
    <h2>🔐 دخول الأدمن</h2>
    <input type="password" id="password" placeholder="أدخل كلمة المرور">
    <button onclick="login()">دخول</button>
  </div>

  <!-- ⚙️ Admin Panel -->
  <div class="admin-card hidden" id="adminBox">
    <h2>⚙️ لوحة التحكم</h2>

    <input type="text" id="productName" placeholder="اسم المنتج">

    <textarea id="productDesc" placeholder="وصف المنتج"></textarea>

    <input type="file" id="productImage" accept="image/*">

    <button onclick="saveProduct()">💾 حفظ المنتج</button>
  </div>

  <script>
    const ADMIN_PASSWORD = "0000";

    function login() {
      const input = document.getElementById("password").value;

      if (input === ADMIN_PASSWORD) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminBox").classList.remove("hidden");
      } else {
        alert("❌ كلمة المرور غير صحيحة");
      }
    }

    function saveProduct() {
      const name = document.getElementById("productName").value;
      const desc = document.getElementById("productDesc").value;
      const imageInput = document.getElementById("productImage");

      localStorage.setItem("productName", name);
      localStorage.setItem("productDesc", desc);

      if (imageInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function () {
          localStorage.setItem("productImage", reader.result);
          alert("✅ تم حفظ المنتج بنجاح");
        };
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        alert("⚠️ اختر صورة للمنتج");
      }
    }
  </script>

</body>
</html>
