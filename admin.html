<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Admin – Electro Salah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: #fff;
      width: 420px;
      max-width: 95%;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    textarea {
      width: 100%;
      margin-top: 20px;
      height: 140px;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>إضافة منتج</h1>

    <label>اسم المنتج</label>
    <input id="name" placeholder="مثال: iPhone 15 Pro">

    <label>السعر</label>
    <input id="price" placeholder="مثال: 8999 درهم">

    <label>رابط صورة المنتج</label>
    <input id="image" placeholder="https://...">

    <button onclick="generate()">إنشاء JSON</button>

    <textarea id="result" placeholder="JSON سيظهر هنا"></textarea>
  </div>

  <script>
    function generate() {
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      const image = document.getElementById("image").value.trim();

      if (!name || !price || !image) {
        alert("رجاءً املأ جميع الحقول");
        return;
      }

      const product = {
        name: name,
        price: price,
        image: image
      };

      document.getElementById("result").value =
        JSON.stringify(product, null, 2) + ",";
    }
  </script>

</body>
</html>
